<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic-Tac-Toe Web Application</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="container">

        <div class="game-container">

            <h1>Tic-Tac-Toe</h1>

            <div class="mode">

                <button id="playerMode" class="mode-btn active">
                    Player vs Player
                </button>

                <button id="computerMode" class="mode-btn">
                    Player vs Computer
                </button>

            </div>

            <div class="scoreboard">

                <div class="score">

                    <h2>Player X</h2>

                    <span id="scoreX">0</span>

                </div>

                <div class="score">

                    <h2>Draw</h2>

                    <span id="drawScore">0</span>

                </div>

                <div class="score">

                    <h2>Player O</h2>

                    <span id="scoreO">0</span>

                </div>

            </div>

            <div class="status" id="status">

                Player X's Turn

            </div>

            <div class="board" id="board">

                <div class="cell" data-index="0"></div>

                <div class="cell" data-index="1"></div>

                <div class="cell" data-index="2"></div>

                <div class="cell" data-index="3"></div>

                <div class="cell" data-index="4"></div>

                <div class="cell" data-index="5"></div>

                <div class="cell" data-index="6"></div>

                <div class="cell" data-index="7"></div>

                <div class="cell" data-index="8"></div>

            </div>

            <div class="buttons">

                <button id="restartBtn">

                    Restart Game

                </button>

                <button id="resetScoreBtn">

                    Reset Score

                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
