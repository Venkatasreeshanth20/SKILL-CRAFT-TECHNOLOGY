<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Web Application</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <div class="calculator">

            <h1>Calculator</h1>

            <div class="display-container">
                <input type="text" id="display" placeholder="0" readonly>
            </div>

            <div class="buttons">

                <!-- First Row -->

                <button class="btn clear" data-value="C">C</button>

                <button class="btn delete" data-value="DEL">⌫</button>

                <button class="btn operator" data-value="%">%</button>

                <button class="btn operator" data-value="/">÷</button>

                <!-- Second Row -->

                <button class="btn number" data-value="7">7</button>

                <button class="btn number" data-value="8">8</button>

                <button class="btn number" data-value="9">9</button>

                <button class="btn operator" data-value="*">×</button>

                <!-- Third Row -->

                <button class="btn number" data-value="4">4</button>

                <button class="btn number" data-value="5">5</button>

                <button class="btn number" data-value="6">6</button>

                <button class="btn operator" data-value="-">−</button>

                <!-- Fourth Row -->

                <button class="btn number" data-value="1">1</button>

                <button class="btn number" data-value="2">2</button>

                <button class="btn number" data-value="3">3</button>

                <button class="btn operator" data-value="+">+</button>

                <!-- Fifth Row -->

                <button class="btn zero number" data-value="0">0</button>

                <button class="btn number" data-value=".">.</button>

                <button class="btn equal" data-value="=">=</button>

            </div>

            <div class="footer">
                <p>Responsive Calculator | HTML • CSS • JavaScript</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
